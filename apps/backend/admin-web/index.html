<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OneCall Management</title>
    <link rel="stylesheet" href="/admin/style.css" />
    <script src="/admin/operations.js" defer></script>
    <script src="/admin/parcels.js" defer></script>
    <script src="/admin/management.js" defer></script>
    <script src="/admin/app.js" defer></script>
  </head>
  <body>
    <header>
      <strong>OneCall</strong><span>Management System</span
      ><button id="logout" hidden>Sign out</button>
    </header>
    <main>
      <p id="notice" role="status" aria-live="polite"></p>
      <section id="login">
        <h1>Management sign-in</h1>
        <p>Use the email of your authorised operations account.</p>
        <form id="login-form">
          <label
            >Email<input
              id="email"
              type="email"
              autocomplete="username"
              required /></label
          ><label
            >Password<input
              id="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button>Sign in</button>
        </form>
      </section>
      <section id="workspace" hidden>
        <aside>
          <p id="operator"></p>
          <nav id="navigation" aria-label="Management areas"></nav>
        </aside>
        <div class="workspace-main">
          <h1 id="page-title">Operations Centre</h1>
          <div id="content"></div>
        </div>
      </section>
    </main>
  </body>
</html>
