<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OneCall Operations</title>
    <link rel="stylesheet" href="/admin/style.css" />
    <script src="/admin/operations.js" defer></script>
    <script src="/admin/app.js" defer></script>
  </head>
  <body>
    <header>
      <strong>OneCall</strong><span>Operations</span
      ><button id="logout" hidden>Sign out</button>
    </header>
    <main>
      <p id="notice" role="status" aria-live="polite"></p>
      <section id="login">
        <h1>Admin sign-in</h1>
        <p>Use the email of your authorised operations account.</p>
        <form id="login-form">
          <label
            >Email<input
              id="email"
              type="email"
              autocomplete="username"
              required /></label
          ><label
            >Password<input
              id="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button>Sign in</button>
        </form>
      </section>
      <section id="workspace" hidden>
        <h1>Operations workspace</h1>
        <nav>
          <button data-view="overview">Overview</button
          ><button data-view="providers">Providers</button
          ><button data-view="bookings">Bookings</button
          ><button data-view="support">Support</button>
        </nav>
        <p>
          Providers and bookings support search and pages. Payments remain
          unconfigured.
        </p>
        <div id="content"></div>
      </section>
    </main>
  </body>
</html>
