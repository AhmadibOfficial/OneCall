# Disposable acceptance services on separate loopback ports; data vanishes on removal.
name: onecall-kaduna-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onecall_test
      POSTGRES_PASSWORD: onecall_test_only
      POSTGRES_DB: onecall_test
    ports:
      - "127.0.0.1:54339:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecall_test -d onecall_test"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:63809:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
