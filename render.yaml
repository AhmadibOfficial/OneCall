# Draft only: review in Render before provisioning.
previews:
  generation: 'off'
services:
- type: web
  name: onecall-staging-api
  runtime: docker
  region: frankfurt
  plan: free
  dockerfilePath: ./deploy/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  healthCheckPath: /api/v1/health/ready
  envVars:
  - key: NODE_ENV
    value: production
  - key: HOST
    value: 0.0.0.0
  - key: PORT
    value: '10000'
  - key: APP_NAME
    value: OneCall
  - key: APP_VERSION
    value: 0.1.0
  - key: API_PREFIX
    value: api/v1
  - key: TRUST_PROXY
    value: '1'
  - key: DATABASE_POOL_SIZE
    value: '5'
  - key: DATABASE_URL
    fromDatabase:
      name: onecall-staging-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: onecall-staging-cache
      property: connectionString
  - key: JWT_SECRET
    generateValue: true
  - key: JWT_REFRESH_SECRET
    generateValue: true
  - key: PAYMENT_WEBHOOK_SECRET
    generateValue: true
  - key: AUTH_DELIVERY_SECRET
    fromService:
      type: web
      name: onecall-staging-delivery
      envVarKey: AUTH_DELIVERY_SECRET
  - key: AUTH_DELIVERY_URL
    sync: false
  - key: THROTTLE_KEY_PREFIX
    value: 'onecall:staging:throttle:'
  - key: CORS_ORIGINS
    value: ''
  - key: ONECALL_UPLOADS_ENABLED
    value: 'false'
  - key: ONECALL_SOCIAL_LOGIN_ENABLED
    value: 'false'
  - key: ONECALL_WALLET_ENABLED
    value: 'false'
  - key: PAYSTACK_SECRET_KEY
    value: ''
  - key: ONECALL_MIGRATE_ON_START
    value: 'true'
- type: web
  name: onecall-staging-delivery
  runtime: docker
  region: frankfurt
  plan: free
  dockerfilePath: ./deploy/Dockerfile
  dockerContext: .
  dockerCommand: node scripts/start-auth-delivery.cjs
  autoDeployTrigger: 'off'
  healthCheckPath: /health
  envVars:
  - key: AUTH_DELIVERY_HOST
    value: 0.0.0.0
  - key: AUTH_DELIVERY_PORT
    value: '10000'
  - key: AUTH_DELIVERY_SECRET
    generateValue: true
  - key: AUTH_DELIVERY_REDIS_URL
    fromService:
      type: keyvalue
      name: onecall-staging-cache
      property: connectionString
  - key: AUTH_DELIVERY_REDIS_PREFIX
    value: 'onecall:staging:delivery:'
  - key: RESEND_API_KEY
    sync: false
  - key: AUTH_EMAIL_FROM
    sync: false
  - key: TERMII_API_KEY
    sync: false
  - key: TERMII_BASE_URL
    sync: false
  - key: TERMII_SENDER_ID
    sync: false
- type: keyvalue
  name: onecall-staging-cache
  region: frankfurt
  plan: free
  maxmemoryPolicy: noeviction
  ipAllowList: []
databases:
- name: onecall-staging-db
  region: frankfurt
  plan: free
  databaseName: onecall_staging
  user: onecall_staging
  ipAllowList: []
